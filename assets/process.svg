<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="174" viewBox="0 0 1280 174" role="img" aria-labelledby="title desc"><title id="title">How I work</title><desc id="desc">Frame a problem, build, verify and demonstrate</desc>
<rect width="1280" height="174" rx="16" fill="#F5F0E7"/><rect x="2" y="2" width="1276" height="170" rx="14" fill="none" stroke="#191D27" stroke-width="3"/>
<path d="M318 0V174M639 0V174M957 0V174" stroke="#191D27" stroke-width="3"/>
<rect width="318" height="12" fill="#4565D8"/><rect x="320" width="319" height="12" fill="#FA9176"/><rect x="641" width="316" height="12" fill="#D4EE86"/><rect x="959" width="321" height="12" fill="#FFD26E"/>
<text x="25" y="59" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#4565D8" >01 / FRAME</text><text x="25" y="99" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#191D27" >Understand the problem</text><text x="25" y="131" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#191D27" >and define the scope</text>
<text x="345" y="59" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#DF5B44" >02 / BUILD</text><text x="345" y="99" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#191D27" >Write the core logic</text><text x="345" y="131" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#191D27" >and connect the product</text>
<text x="665" y="59" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#668823" >03 / VERIFY</text><text x="665" y="99" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#191D27" >Test the real behavior</text><text x="665" y="131" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#191D27" >and state the limits</text>
<text x="980" y="59" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" fill="#A16B00" >04 / SHOW</text><text x="980" y="99" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#191D27" >Present a usable demo</text><text x="980" y="131" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#191D27" >with evidence, not hype</text></svg>