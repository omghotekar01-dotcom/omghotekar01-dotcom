name: Update contribution animation

on:
  workflow_dispatch:
  schedule:
    - cron: "21 3 * * *"

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build contribution animation from GitHub data
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: omghotekar01-dotcom
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/github-snake.svg?palette=github-dark
      - name: Save updated animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh contribution animation"
            git push
          fi
